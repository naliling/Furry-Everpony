<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Furry Everpony</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 50% 0%, #1a1f2b 0%, #0f0f11 55%, #060910 100%);
    color: #e8eaf0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 28px;
  }
  .card {
    width: min(560px, 100%); background: rgba(20, 22, 28, 0.86);
    border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 18px;
    padding: 34px 32px 26px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
  }
  .glyph { font-size: 30px; color: #7dd3c0; letter-spacing: 4px; margin-bottom: 10px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0 0 10px; }
  p { margin: 0 0 14px; line-height: 1.65; color: #aab3c5; font-size: 14px; }
  .detail { color: #8b94a7; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  .spinner {
    width: 26px; height: 26px; margin: 6px 0 18px; border-radius: 50%;
    border: 3px solid rgba(125, 211, 192, 0.18); border-top-color: #7dd3c0;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 16px; }
  button {
    appearance: none; border: 1px solid rgba(148, 163, 184, 0.3); background: rgba(148, 163, 184, 0.1);
    color: #e8eaf0; padding: 9px 16px; border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: rgba(148, 163, 184, 0.18); }
  button.primary { background: #2f9c86; border-color: #2f9c86; color: #fff; }
  button.primary:hover { background: #38b39a; }
  button:disabled { opacity: 0.55; cursor: default; }
  .hint { margin: 4px 0 0; font-size: 12px; color: #6b7488; word-break: break-all; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; }
</style>
</head>
<body>
<main class="card">
  <div class="glyph" aria-hidden="true">✦ ╭ ✦</div>
  <div id="spinner" class="spinner"></div>
  <h1 id="title">正在启动本地服务…</h1>
  <p id="detail" class="detail"></p>
  <div class="actions">
    <button id="retry" class="primary" hidden>重试启动服务</button>
    <button id="reload" hidden>重新加载界面</button>
    <button id="logs">打开日志目录</button>
  </div>
  <p class="hint">日志目录：<span id="logDir" class="mono">读取中…</span></p>
</main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var state = params.get('state') || 'starting';
  var message = params.get('message') || '';
  var appUrl = params.get('appUrl') || '';
  var fe = window.fe || {};
  var diagnostics = fe.diagnostics || {};

  var titleEl = document.getElementById('title');
  var detailEl = document.getElementById('detail');
  var spinnerEl = document.getElementById('spinner');
  var retryEl = document.getElementById('retry');
  var reloadEl = document.getElementById('reload');
  var logsEl = document.getElementById('logs');
  var logDirEl = document.getElementById('logDir');

  if (message) detailEl.textContent = message;

  if (state === 'failed') {
    spinnerEl.hidden = true;
    titleEl.textContent = '本地服务启动失败';
    if (!message) detailEl.textContent = '服务端多次启动失败，已停止自动重启。可以先查看日志，再重试启动。';
    retryEl.hidden = false;
  } else if (state === 'crashed') {
    spinnerEl.hidden = true;
    titleEl.textContent = '界面进程意外退出';
    if (!message) detailEl.textContent = '界面已切到恢复页，数据没有丢失。重新加载即可回到应用。';
    reloadEl.hidden = !appUrl;
    retryEl.hidden = false;
  } else {
    titleEl.textContent = '正在启动本地服务…';
    if (!message) detailEl.textContent = '首次启动或更新后需要几秒钟，请稍候。';
  }

  logsEl.addEventListener('click', function () {
    try {
      var open = (diagnostics && diagnostics.openLogDir) || fe.openLogDir;
      if (typeof open === 'function') {
        var result = open();
        if (result && typeof result.catch === 'function') {
          result.catch(function () { /* 忽略 */ });
        }
      }
    } catch (err) { /* 忽略 */ }
  });

  reloadEl.addEventListener('click', function () {
    if (appUrl) window.location.href = appUrl;
  });

  retryEl.addEventListener('click', function () {
    var restart = diagnostics && diagnostics.restartServer;
    if (typeof restart !== 'function') return;
    retryEl.disabled = true;
    retryEl.textContent = '正在重试…';
    Promise.resolve()
      .then(function () { return restart(); })
      .then(function () {
        setTimeout(function () {
          retryEl.disabled = false;
          retryEl.textContent = '重试启动服务';
        }, 4000);
      })
      .catch(function () {
        retryEl.disabled = false;
        retryEl.textContent = '重试启动服务';
      });
  });

  try {
    if (diagnostics && diagnostics.logDir) logDirEl.textContent = diagnostics.logDir;
    else if (diagnostics && typeof diagnostics.getInfo === 'function') {
      Promise.resolve(diagnostics.getInfo()).then(function (info) {
        if (info && info.logDir) logDirEl.textContent = info.logDir;
      }).catch(function () { /* 忽略 */ });
    }
    if (!diagnostics || !diagnostics.logDir) logDirEl.textContent = '可在设置页查看';
  } catch (err) { /* 忽略 */ }
})();
</script>
</body>
</html>
