<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060910" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Everony —— 打开网页就能和 Bot 聊天" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Everpony" />
    <title>Everony</title>
    <!-- 提前解析当前站点域名，弱网/移动网络下减少首屏等待 -->
    <link rel="preconnect" href="https://ponynaliling.tail31c195.ts.net" />
    <link rel="dns-prefetch" href="https://ponynaliling.tail31c195.ts.net" />
    <style>
      html { background: #060910; color: #e9effd; }
      html[data-theme='light'] { background: #eef3fb; color: #162541; }
      .entry-preview { min-height: 100vh; min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 10px; font: 15px system-ui, sans-serif; }
      .entry-preview strong { font-size: 25px; }
      .entry-preview span { opacity: .78; }
    </style>
    <script>
      // 在任何样式或组件挂载前确定主题和省流偏好。
      try {
        var prefs = document.documentElement.dataset;
        var savedTheme = localStorage.getItem('fe_theme');
        var connection = navigator.connection;
        prefs.theme = savedTheme === 'light' || savedTheme === 'violet' ? savedTheme : 'deep';
        if (localStorage.getItem('fe_lite') === '1' || (connection && (connection.saveData || /2g/.test(connection.effectiveType || '')))) prefs.lite = '1';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="aurora-wallpaper" aria-hidden="true"></div>
    <div id="root"><div class="entry-preview" role="status"><strong>Everony</strong><span>正在打开小马聊天…</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // PWA：注册 Service Worker（不缓存 /api 与 /uploads，详见 /sw.js）
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('[fe] Service Worker 注册失败:', err);
          });
        });
      }
    </script>
  </body>
</html>
